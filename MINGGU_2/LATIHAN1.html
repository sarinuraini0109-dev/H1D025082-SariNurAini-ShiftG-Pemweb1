<!DOCTYPE html>
<html>
    <head>
        <title>Latihan 1</title>
    </head>
    <body></body>
    <form name="form" method="post" action="">
        <table cellpadding="5">
            <tr>
                <td><label for="name">Nama:</label></td>
                <td><input type="text" id="name" name="name" value="Romi"><br></td>
            </tr>
            <tr>
                <td><label for="email">Email:</label></td>
                <td><input type="email" id="email" name="email" value="romi@gmail.com"><br></td>
            </tr>
            <tr>
                <td><label for="username">Username:</label></td>
                <td><input type="text" id="username" name="username" value="romi"><br></td>
            </tr>
            <tr>
                <td><label for="password">Password:</label></td>
                <td><input type="password" id="password" name="password" value="1234"><br></td>
            </tr>

            <tr>
                <td><label for="Jenis Kelamin">Jenis Kelamin</label></td>
                <td>
                    <select id="Jenis Kelamin" name="Jenis Kelamin">
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td valign="middle"><label for="alamat">Alamat:</label></td>
                <td>
                    <textarea id="alamat" name="alamat" rows="10" cols="50">Bogor</textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" value="Simpan" name="save">
                </td>
            </tr>
        </table>
    </form>
</body>   
</html>
