<!DOCTYPE html>
<html>
    <head>
        <title>Tugas 1</title>
    </head>
    <body>
        <form action="" method="post">

            <label>Input 1:</label>
            <input type="text" value="Value Tetap" readonly><br><br>

            <label>Input 2:</label>
            <input type="text" maxlength="5"><br><br>

            <label>Input 3:</label>
            <input type="text" disabled><br><br>

            <label>Input 4:</label>
            <input type="text" required><br><br>

            <label>Input 5:</label>
            <input type="text" pattern="[a-z0-9]{9}" title="9 karakter, hanya huruf kecil dan angka, tidak dapat diisi simbol serta penggunaan kapital">
            <br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
