<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Praktikum Pemrograman Web</title>
</head>
<body>
    <img name="img1" src="gambar1.jfif" style="width: 100px; height: 100px;" onMouseOver="ganti_gambar2()" onMouseout="ganti_gambar1()">
    <script>
        function ganti_gambar1() {
            document.img1.src = "gambar1.jfif";
    }
        function ganti_gambar2() {
            document.img1.src = "gambar2.jfif";
    }
    </script>
</body>
</html>
